services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["/var/www/entrypoint.sh"]
    container_name: lorelibrarium_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./lorelibrarium:/var/www
    networks:
      - lorelibrarium
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lorelibrarium
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: lorelibrarium_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lorelibrarium
      MYSQL_USER: lorelibrarium
      MYSQL_PASSWORD: lorelibrarium
    ports:
      - "3306:3306"
    networks:
      - lorelibrarium

  redis:
    image: redis:alpine
    container_name: lorelibrarium_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lorelibrarium

networks:
  lorelibrarium:
